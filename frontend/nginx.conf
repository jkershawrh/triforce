# Triforce frontend — API proxy + SPA routing
# Loaded by UBI nginx from /opt/app-root/etc/nginx.default.d/

resolver 172.30.0.10 valid=10s ipv6=off;

# API proxies — variable-based proxy_pass for dynamic DNS resolution
# FQDNs required because nginx resolver ignores /etc/resolv.conf search domains
location /healthcare/ {
    set $healthcare_backend "http://healthcare-agent.triforce.svc.cluster.local:8081";
    rewrite ^/healthcare/(.*) /$1 break;
    proxy_pass $healthcare_backend;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
}

location /finserv/ {
    set $finserv_backend "http://finserv-agent.triforce.svc.cluster.local:8082";
    rewrite ^/finserv/(.*) /$1 break;
    proxy_pass $finserv_backend;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
}

location /orchestrator/ {
    set $orchestrator_backend "http://orchestrator.triforce.svc.cluster.local:8083";
    rewrite ^/orchestrator/(.*) /$1 break;
    proxy_pass $orchestrator_backend;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
}

location /mcp-gateway/ {
    set $mcp_backend "http://mcp-gateway.triforce.svc.cluster.local:8091";
    rewrite ^/mcp-gateway/(.*) /$1 break;
    proxy_pass $mcp_backend;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}

location /router/ {
    set $router_backend "http://semantic-router.triforce.svc.cluster.local:8094";
    rewrite ^/router/(.*) /$1 break;
    proxy_pass $router_backend;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}

location /litellm/ {
    set $litellm_backend "http://litellm.triforce.svc.cluster.local:4000";
    rewrite ^/litellm/(.*) /$1 break;
    proxy_pass $litellm_backend;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
}

location /bitnet/ {
    set $edge_backend "http://edge-agent.triforce.svc.cluster.local:8080";
    rewrite ^/bitnet/(.*) /$1 break;
    proxy_pass $edge_backend;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
}

# SPA routing — serve index.html for non-file paths
location / {
    try_files $uri $uri/ /index.html;
}
